name: CI/CD - Beidou Satellite Messenger

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  id-token: write

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.4'
  ANDROID_SDK_VERSION: '34'
  ANDROID_BUILD_TOOLS_VERSION: '34.0.0'
  ANDROID_NDK_VERSION: '26.1.10909125'

jobs:
  # ============================================================
  # LINT & STATIC ANALYSIS
  # ============================================================
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/build-cache
            ~/.android/cache
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Run Android Lint
        run: bash ./gradlew lintDebug --no-daemon
        continue-on-error: true

      - name: Run Detekt (if configured)
        run: bash ./gradlew detekt --no-daemon
        continue-on-error: true

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results*.html
          retention-days: 7

  # ============================================================
  # UNIT TESTS
  # ============================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Run Unit Tests
        run: bash ./gradlew testDebugUnitTest --no-daemon --continue
        continue-on-error: true

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: app/build/reports/jacoco/
          retention-days: 7

  # ============================================================
  # BUILD DEBUG APK
  # ============================================================
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint, test]
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          build-tools-version: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          emulator: false

      - name: Build Debug APK
        run: bash ./gradlew assembleDebug --no-daemon
        continue-on-error: true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Mapping File
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mapping-file
          path: app/build/outputs/mapping/debug/*.txt
          retention-days: 30

  # ============================================================
  # BUILD RELEASE (AAB + APK)
  # ============================================================
  build-release:
    name: Build Release (AAB + APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [lint, test]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Debug Secrets
        run: |
          echo "KEYSTORE_BASE64 is set: ${{ secrets.KEYSTORE_BASE64 != '' }}"
          echo "KEYSTORE_PASSWORD is set: ${{ secrets.KEYSTORE_PASSWORD != '' }}"
          echo "KEY_ALIAS is set: ${{ secrets.KEY_ALIAS != '' }}"
          echo "KEY_PASSWORD is set: ${{ secrets.KEY_PASSWORD != '' }}"

      - name: Decode Keystore
        id: keystore
        run: |
          set -e
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "KEYSTORE_BASE64 is set, length: ${#${{ secrets.KEYSTORE_BASE64 }}}"
            # Write base64 to file first to handle newlines properly
            echo "${{ secrets.KEYSTORE_BASE64 }}" > keystore.b64
            base64 -d keystore.b64 > release.keystore
            echo "filePath=release.keystore" >> $GITHUB_OUTPUT
            echo "Keystore decoded successfully, size: $(wc -c < release.keystore) bytes"
            # Verify keystore
            keytool -list -keystore release.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" || echo "Keytool verification failed"
          else
            echo "KEYSTORE_BASE64 secret not set, skipping keystore decode"
            echo "filePath=" >> $GITHUB_OUTPUT
          fi

      - name: Build Release AAB
        if: ${{ steps.keystore.outputs.filePath != '' }}
        run: |
          bash ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=${{ steps.keystore.outputs.filePath }} \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            --no-daemon
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Release APK
        if: ${{ steps.keystore.outputs.filePath != '' }}
        run: |
          bash ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ steps.keystore.outputs.filePath }} \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            --no-daemon
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/*.txt
          retention-days: 90

  # ============================================================
  # CREATE GITHUB RELEASE
  # ============================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Generate Release Notes
        id: release_notes
        run: |
          # Get commit messages since last tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%an)" $PREVIOUS_TAG..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%an)" -20)
          fi
          
          cat << EOF > release_notes.md
          ## Beidou Satellite Messenger ${{ github.ref_name }}
          
          ### Changes
          $CHANGELOG
          
          ### Downloads
          - **AAB (Google Play)**: \`app-release.aab\`
          - **APK (Direct Install)**: \`app-release.apk\`
          - **Mapping File**: \`mapping.txt\` (for crash symbolication)
          
          ### Installation
          1. Download the APK file
          2. Enable "Install from unknown sources" in Android settings
          3. Install the APK
          4. Grant all requested permissions (Location, SMS, Phone, Sensors)
          
          ### Requirements
          - Android 8.0+ (API 26+)
          - HMS Core (for satellite features)
          - Device with BeiDou satellite hardware (Huawei Pura 70, Mate 60 series, etc.)
          - OR enable "Test Mode" in Settings for simulation
          
          ### Region Bypass
          This app includes region bypass to enable satellite features worldwide:
          - Settings → Region Bypass → Enable
          - Select bypass method (Software Spoof recommended)
          
          ---
          *Built from commit ${{ github.sha }}*
          EOF
          
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Beidou Satellite Messenger ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            release-artifacts/app-release.aab
            release-artifacts/app-release.apk
            release-artifacts/mapping.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # PUBLISH TO GOOGLE PLAY (Optional)
  # ============================================================
  publish-play-store:
    name: Publish to Google Play (Internal Testing)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'Kyognah/BeidouSatelliteApp'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Upload to Play Store Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.huawei.beidousatellite
          releaseFiles: release-artifacts/app-release.aab
          track: internal
          status: completed
          inAppUpdatePriority: 2
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

  # ============================================================
  # NOTIFICATION
  # ============================================================
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test, build-debug, build-release, create-release]
    if: failure()
    steps:
      - name: Send Failure Notification
        run: |
          echo "Build failed for ${{ github.repository }}@${{ github.sha }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run: ${{ github.run_id }}"
        # Add your notification method here (Slack, Discord, Email, etc.)
        # Example for Slack:
        # curl -X POST -H 'Content-type: application/json' \
        #   --data '{"text":"Build failed: ${{ github.repository }}"}' \
        #   ${{ secrets.SLACK_WEBHOOK_URL }}